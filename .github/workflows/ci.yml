name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reject tracked working artifacts
        run: |
          python - <<'PY'
          import subprocess

          blocked = subprocess.check_output(
              ["git", "ls-files", "--cached", "--ignored", "--exclude-from=.gitignore"],
              text=True,
          )
          if blocked:
              raise SystemExit("Keep local/generated files out of Git:\n" + blocked)
          PY

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check objective authoring API
        run: mypy

      - name: Tests (pytest)
        run: |
          pytest -q
