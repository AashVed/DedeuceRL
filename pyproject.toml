[project]
name = "dedeucerl"
version = "1.1.1"
description = "A modular framework for hidden-system exploration and control benchmarks"
readme = {file = "README_PYPI.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vedansh"},
]
keywords = [
    "reinforcement-learning",
    "llm",
    "benchmarks",
    "evaluation",
    "active-learning",
    "system-identification",
    "mealy-machines",
    "api-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14,<0.2",
    "datasets>=3.0,<4.7.0",
    "mcp>=2.1.1,<3",
    "pydantic>=2.10,<3",
    "jsonschema>=4,<5",
]

[project.urls]
Homepage = "https://github.com/AashVed/DedeuceRL"
Repository = "https://github.com/AashVed/DedeuceRL"
Issues = "https://github.com/AashVed/DedeuceRL/issues"

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20",
]
gemini = [
    "google-genai>=0.1",  # Google Gen AI SDK (official, supported)
]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff==0.14.11",
    "mypy>=1.15,<2",
]

[project.scripts]
dedeucerl-eval = "dedeucerl.cli.eval:main"
dedeucerl-eval-parallel = "dedeucerl.cli.eval_parallel:main"
dedeucerl-generate = "dedeucerl.cli.generate:main"
dedeucerl-aggregate = "dedeucerl.cli.aggregate:main"
dedeucerl-selfcheck = "dedeucerl.cli.selfcheck:main"
dedeucerl-mcp = "dedeucerl.cli.mcp:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dedeucerl*"]

[tool.setuptools.package-data]
dedeucerl = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = [
    "dedeucerl/ir",
    "dedeucerl/kernel/types.py",
    "dedeucerl/kernel/mealy.py",
    "dedeucerl/runtime/episode.py",
    "examples/custom_objective.py",
]
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
